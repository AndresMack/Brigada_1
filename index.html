<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">

<title>Brigada de Cocina · Dos Recetas</title>

<style>
:root{
  --bg:#f3f5f7;
  --card:#ffffff;
  --ink:#111827;
  --muted:#667085;
  --line:#e4e7ec;
  --nav:#0f172a;
  --accent:#2563eb;
  --green:#067647;
  --green-bg:#ecfdf3;
  --orange:#b54708;
  --orange-bg:#fff6ed;
  --soft:#eff6ff;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  line-height:1.45;
  -webkit-tap-highlight-color:transparent;
}

button{
  font:inherit;
}

/* =========================================
   CABECERA
========================================= */

.header{
  position:sticky;
  top:0;
  z-index:40;
  background:rgba(15,23,42,.97);
  color:#fff;
  padding-top:env(safe-area-inset-top);
  box-shadow:0 1px 8px rgba(0,0,0,.12);
}

.header-main{
  padding:12px 14px 10px;
}

.header-title{
  font-size:18px;
  font-weight:850;
  margin:0;
}

.header-sub{
  font-size:11px;
  opacity:.7;
  margin-top:2px;
}

.recipe-tabs{
  display:flex;
  gap:8px;
  padding:0 12px 10px;
  overflow-x:auto;
  scrollbar-width:none;
}

.recipe-tabs::-webkit-scrollbar{
  display:none;
}

.recipe-tab{
  flex:0 0 auto;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.08);
  color:white;
  border-radius:999px;
  padding:9px 13px;
  font-weight:800;
  font-size:13px;
  cursor:pointer;
}

.recipe-tab.active{
  background:#fff;
  color:var(--nav);
}

/* =========================================
   CONTENIDO
========================================= */

main{
  max-width:920px;
  margin:auto;
  padding:12px 12px calc(90px + env(safe-area-inset-bottom));
}

.hero,
.progress-card,
.person-card,
.plating-card,
.image-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
}

.hero{
  padding:15px;
  margin-bottom:10px;
}

.hero h1{
  font-size:22px;
  line-height:1.15;
  margin:0 0 6px;
}

.hero p{
  margin:0;
  color:var(--muted);
  font-size:13px;
}

.critical{
  margin-top:12px;
  padding:11px 12px;
  background:var(--orange-bg);
  color:#7a2e0e;
  border-left:4px solid #f79009;
  border-radius:10px;
  font-size:13px;
  font-weight:650;
}

/* =========================================
   IMAGEN
========================================= */

.image-card{
  overflow:hidden;
  margin-bottom:10px;
}

.image-button{
  width:100%;
  display:block;
  padding:0;
  border:0;
  background:white;
  cursor:zoom-in;
  text-align:left;
}

.image-wrap{
  position:relative;
  aspect-ratio:16/10;
  background:#f8fafc;
  overflow:hidden;
}

.image-wrap img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.zoom-hint{
  position:absolute;
  right:9px;
  bottom:9px;
  background:rgba(15,23,42,.85);
  color:white;
  border-radius:999px;
  padding:7px 10px;
  font-size:11px;
  font-weight:800;
}

.image-caption{
  padding:9px 11px;
  color:var(--muted);
  font-size:12px;
  border-top:1px solid var(--line);
}

/* =========================================
   PROGRESO
========================================= */

.progress-card{
  padding:12px;
  margin-bottom:10px;
}

.progress-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:12px;
  margin-bottom:7px;
}

.track{
  height:9px;
  border-radius:999px;
  background:#e9edf2;
  overflow:hidden;
}

.fill{
  height:100%;
  background:var(--accent);
  border-radius:999px;
  transition:width .2s ease;
}

/* =========================================
   FILTROS PERSONAS
========================================= */

.filters{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:1px 0 10px;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  flex:0 0 auto;
  background:white;
  border:1px solid var(--line);
  border-radius:999px;
  padding:9px 12px;
  font-size:12px;
  font-weight:800;
  color:#344054;
  cursor:pointer;
}

.filter.active{
  background:var(--soft);
  border-color:#84adff;
  color:#1849a9;
}

/* =========================================
   PERSONAS
========================================= */

.people{
  display:grid;
  gap:10px;
}

.person-card{
  overflow:hidden;
}

.person-head{
  padding:13px 13px 11px;
  background:#fafafa;
  border-bottom:1px solid var(--line);
}

.person-title-row{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}

.person-head h2{
  font-size:18px;
  margin:0;
}

.person-role{
  margin-top:2px;
  color:var(--muted);
  font-size:12px;
}

.badge{
  background:var(--green-bg);
  color:var(--green);
  font-size:10px;
  font-weight:850;
  padding:5px 7px;
  border-radius:999px;
  white-space:nowrap;
}

.person-progress{
  margin-top:9px;
}

.person-progress-label{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:10px;
  margin-bottom:4px;
}

.person-progress .track{
  height:6px;
}

/* =========================================
   TAREAS
========================================= */

.task{
  border-bottom:1px solid var(--line);
}

.task:last-child{
  border-bottom:0;
}

.task-summary{
  width:100%;
  border:0;
  background:white;
  display:grid;
  grid-template-columns:30px 1fr 22px;
  align-items:center;
  gap:8px;
  text-align:left;
  padding:12px;
  cursor:pointer;
}

.check{
  width:26px;
  height:26px;
  border:2px solid #cbd5e1;
  border-radius:8px;
  display:grid;
  place-items:center;
  font-weight:900;
  color:white;
  background:white;
}

.task.done .check{
  background:var(--green);
  border-color:var(--green);
}

.task.done .task-name{
  text-decoration:line-through;
  color:#98a2b3;
}

.task-name{
  font-size:13px;
  font-weight:800;
  line-height:1.3;
}

.chev{
  font-size:18px;
  color:#98a2b3;
  transition:transform .18s ease;
  text-align:center;
}

.task.open .chev{
  transform:rotate(180deg);
}

.task-body{
  display:none;
  padding:0 12px 13px 50px;
  background:white;
}

.task.open .task-body{
  display:block;
}

.task-detail{
  font-size:12px;
  color:#475467;
  margin:0;
}

.tip{
  margin-top:8px;
  background:#f8fafc;
  border-radius:9px;
  padding:8px 9px;
  font-size:11px;
  color:#475467;
}

.tip b{
  color:#1d2939;
}

/* =========================================
   EMPLATADO
========================================= */

.plating-card{
  padding:13px;
  margin-top:10px;
}

.plating-card h3{
  font-size:15px;
  margin:0 0 8px;
}

.plating-card ol{
  margin:0;
  padding-left:20px;
}

.plating-card li{
  margin:6px 0;
  font-size:12px;
  color:#475467;
}

/* =========================================
   BARRA INFERIOR
========================================= */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:35;
  background:rgba(255,255,255,.96);
  border-top:1px solid var(--line);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  backdrop-filter:blur(12px);
}

.bottom-inner{
  max-width:920px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.action{
  min-height:44px;
  border-radius:12px;
  border:1px solid var(--line);
  font-weight:850;
  font-size:13px;
  background:white;
  color:#344054;
  cursor:pointer;
}

.action.primary{
  background:var(--nav);
  color:white;
  border-color:var(--nav);
}

/* =========================================
   IMAGEN AMPLIADA
========================================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.95);
  display:none;
  flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}

.modal.open{
  display:flex;
}

.modal-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 12px;
  color:white;
}

.modal-title{
  font-size:13px;
  font-weight:750;
  max-width:75%;
}

.modal-close{
  border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.12);
  color:white;
  border-radius:999px;
  width:42px;
  height:42px;
  font-size:22px;
  cursor:pointer;
}

.modal-stage{
  flex:1;
  overflow:auto;
  display:flex;
  align-items:flex-start;
  justify-content:flex-start;
  padding:8px;
}

.modal-stage img{
  display:block;
  width:1400px;
  max-width:none;
  height:auto;
}

.modal-help{
  color:#ddd;
  text-align:center;
  font-size:11px;
  padding:7px 10px 10px;
}

/* =========================================
   PANTALLAS GRANDES
========================================= */

@media(min-width:700px){

  .header-main{
    padding-left:18px;
    padding-right:18px;
  }

  main{
    padding:18px 18px 90px;
  }

  .top-grid{
    display:grid;
    grid-template-columns:minmax(0,1fr) 330px;
    gap:12px;
    align-items:start;
  }

  .image-card{
    grid-column:2;
    grid-row:1 / span 2;
    margin:0;
  }

  .hero{
    grid-column:1;
    margin:0;
  }

  .progress-card{
    grid-column:1;
    margin:0;
  }

  .people{
    grid-template-columns:1fr 1fr;
  }
}

/* =========================================
   IMPRESIÓN
========================================= */

@media print{

  .header,
  .bottom-nav,
  .filters,
  .zoom-hint{
    display:none!important;
  }

  main{
    max-width:none;
    padding:0;
  }

  body{
    background:white;
  }

  .task-body{
    display:block!important;
  }

  .modal{
    display:none!important;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="header-main">
    <div class="header-title">
      Brigada de cocina
    </div>

    <div class="header-sub">
      Santiago · Julián · Sofía · Ángela
    </div>
  </div>

  <nav class="recipe-tabs">

    <button
      class="recipe-tab active"
      data-recipe="r1">
      Receta 1 · Lingote
    </button>

    <button
      class="recipe-tab"
      data-recipe="r2">
      Receta 2 · Bullabesa
    </button>

  </nav>

</header>


<main>

  <div class="top-grid">

    <section class="hero">

      <h1 id="recipeName"></h1>

      <p id="recipeSubtitle"></p>

      <div
        class="critical"
        id="critical">
      </div>

    </section>


    <section
      class="image-card"
      id="imageCard">

      <button
        class="image-button"
        id="openImage"
        type="button">

        <div class="image-wrap">

          <img
            id="recipeImage"
            src=""
            alt="">

          <span class="zoom-hint">
            Tocar para ampliar
          </span>

        </div>

        <div class="image-caption">
          Guía visual de emplatado. Toca la imagen para verla en grande.
        </div>

      </button>

    </section>


    <section class="progress-card">

      <div class="progress-row">

        <b>
          Progreso general
        </b>

        <span id="progressText">
          0 %
        </span>

      </div>

      <div class="track">

        <div
          class="fill"
          id="progressBar"
          style="width:0%">
        </div>

      </div>

    </section>

  </div>


  <div
    class="filters"
    aria-label="Filtrar por persona">

    <button
      class="filter active"
      data-person="all">
      Todos
    </button>

    <button
      class="filter"
      data-person="angela">
      Ángela
    </button>

    <button
      class="filter"
      data-person="sofia">
      Sofía
    </button>

    <button
      class="filter"
      data-person="santiago">
      Santiago
    </button>

    <button
      class="filter"
      data-person="julian">
      Julián
    </button>

  </div>


  <section
    class="people"
    id="people">
  </section>


  <section class="plating-card">

    <h3>
      Orden de emplatado
    </h3>

    <ol id="platingList"></ol>

  </section>

</main>


<nav class="bottom-nav">

  <div class="bottom-inner">

    <button
      class="action"
      id="resetBtn">
      Reiniciar receta
    </button>

    <button
      class="action primary"
      id="printBtn">
      Imprimir / PDF
    </button>

  </div>

</nav>


<!-- ======================================
     MODAL DE IMAGEN
======================================= -->

<div
  class="modal"
  id="imageModal"
  role="dialog"
  aria-modal="true">

  <div class="modal-top">

    <div
      class="modal-title"
      id="modalTitle">
    </div>

    <button
      class="modal-close"
      id="closeModal"
      aria-label="Cerrar">
      ×
    </button>

  </div>


  <div class="modal-stage">

    <img
      id="modalImage"
      src=""
      alt="">

  </div>


  <div class="modal-help">
    Desliza para recorrer la imagen ampliada.
    Puedes utilizar el zoom del navegador para acercarte más.
  </div>

</div>


<script>

/* =========================================
   DATOS DE LAS RECETAS
========================================= */

const recipes = {

  /* =====================================
     RECETA 1
  ===================================== */

  r1: {

    name:
      "Receta 1 · Lingote dorado de pescado",

    subtitle:
      "Lingote de pescado de mar con mousseline de salmón, beurre blanc de limón y tomillo, puré de papa con clorofila y vegetales contemporáneos.",

    critical:
      "Punto crítico de sabor: para 500 g de pescado blanco utilizar como referencia 5 g de sal fina, equivalente aproximadamente al 1 %. Mezclar con ralladura fina de limón, distribuir uniformemente y refrigerar entre 15 y 20 minutos. No agregar jugo de limón durante este reposo.",

    /*
    ========================================
    IMAGEN RECETA 1

    Sube este archivo al mismo directorio
    de este HTML en GitHub.
    ========================================
    */

    image:
      "emplatado_lingote_pescado.png",

    imageAlt:
      "Emplatado del lingote dorado de pescado",


    people: {


      /* =================================
         ÁNGELA
      ================================= */

      angela: {

        name:
          "Ángela",

        role:
          "Responsable principal del pescado y del armado y cocción del lingote",

        badge:
          "Pescado",

        tasks: [

          {
            title:
              "Revisar y acondicionar el pescado",

            detail:
              "Trabajar sobre una bandeja fría. Revisar cada filete al tacto, retirar todas las espinas con pinza, recortar bordes irregulares y secar cuidadosamente con papel absorbente.",

            tip:
              "No lavar el pescado bajo el grifo. El exceso de agua reduce el sabor y dificulta conseguir un buen dorado."
          },

          {
            title:
              "Sazonar el pescado con precisión",

            detail:
              "Para 500 g de pescado blanco pesar aproximadamente 5 g de sal fina. Mezclarla con ralladura fina de limón y una cantidad moderada de pimienta blanca. Distribuirla de manera uniforme por ambas caras de los filetes.",

            tip:
              "El pescado debe quedar bien sazonado porque posteriormente estará acompañado por puré y salsa. Pesar la sal evita diferencias entre porciones."
          },

          {
            title:
              "Reposar el pescado en frío",

            detail:
              "Colocar los filetes sazonados en una bandeja, cubrirlos y refrigerar entre 15 y 20 minutos a una temperatura aproximada de 0 a 4 °C. Después del reposo, secar ligeramente la humedad superficial.",

            tip:
              "La sal penetra en el pescado y la ralladura de limón aporta aroma. No usar jugo de limón porque la acidez comenzaría a modificar la proteína."
          },

          {
            title:
              "Seleccionar las piezas del lingote",

            detail:
              "Elegir dos piezas de pescado con tamaño y grosor similares. Alinear los filetes y recortar únicamente lo necesario para conseguir una forma rectangular y uniforme.",

            tip:
              "Un grosor homogéneo permite que el lingote se cocine de manera pareja."
          },

          {
            title:
              "Armar el lingote con la mousseline elaborada por Sofía",

            detail:
              "Extender una pieza de pescado y colocar una capa uniforme de mousseline de salmón de aproximadamente 6 a 8 milímetros. Dejar un pequeño margen libre en los bordes y cubrir con la segunda pieza de pescado.",

            tip:
              "No colocar demasiada mousseline. Un exceso de relleno puede salir por los bordes durante la cocción."
          },

          {
            title:
              "Compactar el lingote",

            detail:
              "Presionar suavemente las piezas para nivelarlas. Envolver firmemente con película únicamente para darle forma y conseguir un bloque uniforme.",

            tip:
              "La presión debe ser suficiente para compactar, pero no tanta como para expulsar el relleno."
          },

          {
            title:
              "Llevar nuevamente a frío",

            detail:
              "Refrigerar el lingote ya formado durante aproximadamente 10 a 15 minutos. Retirar completamente la película antes de cocinar.",

            tip:
              "Este segundo reposo en frío estabiliza la estructura y facilita conseguir un dorado más limpio."
          },

          {
            title:
              "Dorar en mantequilla y tomillo",

            detail:
              "Secar nuevamente la superficie del lingote. Calentar una sartén, agregar mantequilla y tomillo. Colocar primero la cara de presentación y dejarla quieta hasta obtener un color dorado uniforme. Girar cuidadosamente.",

            tip:
              "La mantequilla debe estar espumosa y aromática, pero nunca quemada."
          },

          {
            title:
              "Bañar continuamente con la mantequilla",

            detail:
              "Inclinar ligeramente la sartén y utilizar una cuchara para bañar varias veces el lingote con la mantequilla caliente aromatizada con tomillo.",

            tip:
              "Este procedimiento aporta sabor, brillo y un tostado más homogéneo."
          },

          {
            title:
              "Finalizar la cocción",

            detail:
              "Terminar en horno aproximadamente entre 150 y 160 °C hasta alcanzar alrededor de 63 °C en el centro del lingote.",

            tip:
              "La temperatura interna es una referencia mucho más precisa que cocinar únicamente por tiempo."
          },

          {
            title:
              "Reposar antes del corte",

            detail:
              "Retirar el lingote del horno y dejar reposar aproximadamente 2 minutos antes de realizar cualquier corte.",

            tip:
              "El reposo ayuda a estabilizar los jugos y evita que el relleno se desplace."
          },

          {
            title:
              "Realizar el corte de presentación",

            detail:
              "Cortar uno de los extremos del lingote en diagonal para mostrar claramente el contraste entre el pescado blanco y la mousseline rosada de salmón.",

            tip:
              "Limpiar cuidadosamente la superficie del corte antes del emplatado."
          }

        ]

      },


      /* =================================
         SOFÍA
      ================================= */

      sofia: {

        name:
          "Sofía",

        role:
          "Responsable de la mousseline de salmón y apoyo directo de Ángela",

        badge:
          "Mousseline",

        tasks: [

          {
            title:
              "Preparar una estación completamente fría",

            detail:
              "Mantener el salmón, la crema de leche, la clara de huevo, el recipiente y las cuchillas del procesador muy fríos antes de comenzar.",

            tip:
              "La temperatura baja ayuda a mantener estable la emulsión."
          },

          {
            title:
              "Limpiar y pesar el salmón",

            detail:
              "Limpiar aproximadamente 100 g de salmón, retirar piel y espinas y mantenerlo refrigerado hasta el momento de procesarlo.",

            tip:
              "El salmón debe permanecer frío durante todo el procedimiento."
          },

          {
            title:
              "Sazonar el salmón",

            detail:
              "Agregar aproximadamente entre 1,5 y 2 g de sal fina al salmón y una pequeña cantidad de pimienta blanca.",

            tip:
              "Agregar la sal al comienzo favorece la extracción de proteínas y mejora la capacidad de ligar de la mousseline."
          },

          {
            title:
              "Procesar el salmón",

            detail:
              "Procesar el salmón frío hasta obtener una pasta completamente homogénea y ligeramente pegajosa.",

            tip:
              "Procesar en intervalos cortos para impedir que aumente demasiado la temperatura."
          },

          {
            title:
              "Incorporar la clara",

            detail:
              "Agregar la clara de huevo y continuar procesando hasta integrarla completamente.",

            tip:
              "La mezcla debe conservar una textura uniforme antes de incorporar la crema."
          },

          {
            title:
              "Agregar la crema fría",

            detail:
              "Incorporar la crema de leche muy fría poco a poco mientras se procesa hasta obtener una mezcla fina, cremosa y estable.",

            tip:
              "No agregar toda la crema de una sola vez porque puede dificultar la emulsión."
          },

          {
            title:
              "Perfumar con ralladura de limón",

            detail:

/* =========================================
   ESTADO
========================================= */

let currentRecipe = "r1";
let personFilter = "all";


function storageKey(recipeId, personId, taskIndex){

  return (
    "brigada-cocina:" +
    recipeId +
    ":" +
    personId +
    ":" +
    taskIndex
  );

}


function isDone(recipeId, personId, taskIndex){

  return (
    localStorage.getItem(
      storageKey(
        recipeId,
        personId,
        taskIndex
      )
    ) === "1"
  );

}


function setDone(
  recipeId,
  personId,
  taskIndex,
  value
){

  localStorage.setItem(
    storageKey(
      recipeId,
      personId,
      taskIndex
    ),
    value ? "1" : "0"
  );

}


/* =========================================
   SEGURIDAD TEXTO
========================================= */

function escapeHTML(text){

  return String(text).replace(
    /[&<>"']/g,
    function(character){

      const entities = {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      };

      return entities[character];

    }
  );

}


/* =========================================

========================================= */

  const recipe =
    recipes[currentRecipe];


  /* ------------------------------
     Información principal
  ------------------------------ */

  document
    .getElementById("recipeName")
    .textContent =
      recipe.name;


  document
    .getElementById("recipeSubtitle")
    .textContent =
      recipe.subtitle;


  document
    .getElementById("critical")
    .textContent =
      recipe.critical;


  /* ------------------------------
     Imagen
  ------------------------------ */

  const image =
    document.getElementById(
      "recipeImage"
    );


  image.src =
    recipe.image;


  image.alt =
    recipe.imageAlt;


  /* ------------------------------
     Tabs
  ------------------------------ */

  document
    .querySelectorAll(
      ".recipe-tab"
    )
    .forEach(function(button){

      button
        .classList
        .toggle(
          "active",
          button.dataset.recipe ===
          currentRecipe
        );

    });


  /* ------------------------------

  ------------------------------ */

  document
    .querySelectorAll(
      ".filter"
    )
    .forEach(function(button){

      button
        .classList
        .toggle(
          "active",
          button.dataset.person ===
          personFilter
        );

  /* ------------------------------

  ------------------------------ */

  const peopleContainer =
    document.getElementById(
      "people"
    );


  peopleContainer.innerHTML =
    "";


  let totalTasks = 0;
  let completedTasks = 0;


  Object.entries(
    recipe.people
  )
  .forEach(function(entry){

    const personId =
      entry[0];

    const person =
      entry[1];


    totalTasks +=
      person.tasks.length;


    const personCompleted =
      person.tasks.filter(
        function(task,index){

          return isDone(
            currentRecipe,
            personId,
            index
          );

        }
      ).length;


    completedTasks +=
      personCompleted;


    if(
      personFilter !== "all" &&
      personFilter !== personId
    ){
      return;
    }


    const percentage =
      Math.round(
        (
          personCompleted /
          person.tasks.length
        ) * 100
      );


    const card =
      document.createElement(
        "article"
      );


    card.className =
      "person-card";


    card.innerHTML = `

      <div class="person-head">

        <div class="person-title-row">

          <div>

            <h2>
              ${escapeHTML(person.name)}
            </h2>

            <div class="person-role">
              ${escapeHTML(person.role)}
            </div>

          </div>

          <span class="badge">
            ${escapeHTML(person.badge)}
          </span>

        </div>


        <div class="person-progress">

          <div class="person-progress-label">

            <span>
              Progreso
            </span>

            <span>
              ${personCompleted}/${person.tasks.length}
              ·
              ${percentage} %
            </span>

          </div>


          <div class="track">

            <div
              class="fill"
              style="width:${percentage}%">
            </div>

          </div>

        </div>

      </div>


      <div class="task-list">
      </div>

    `;


    const taskList =
      card.querySelector(
        ".task-list"
      );


    person.tasks.forEach(
      function(task,index){

        const completed =
          isDone(
            currentRecipe,
            personId,
            index
          );


        const taskElement =
          document.createElement(
            "div"
          );


        taskElement.className =
          "task" +
          (
            completed
            ? " done"
            : ""
          );


        taskElement.innerHTML = `

          <button
            class="task-summary"
            type="button">

            <span class="check">
              ${completed ? "✓" : ""}
            </span>

            <span class="task-name">

              ${index + 1}.
              ${escapeHTML(task.title)}

            </span>

            <span class="chev">
              ⌄
            </span>

          </button>


          <div class="task-body">

            <p class="task-detail">
              ${escapeHTML(task.detail)}
            </p>

            <div class="tip">

              <b>
                Clave de sabor/técnica:
              </b>

              ${escapeHTML(task.tip)}

            </div>

          </div>

        `;


        const summary =
          taskElement.querySelector(
            ".task-summary"
          );


        const check =
          taskElement.querySelector(
            ".check"
          );


        summary.addEventListener(
          "click",
          function(event){

            if(
              event.target === check
            ){

              setDone(
                currentRecipe,
                personId,
                index,
                !isDone(
                  currentRecipe,
                  personId,
                  index
                )
              );


              render();

              return;
            }


            taskElement
              .classList
              .toggle(
                "open"
              );

          }
        );


        taskList.appendChild(
          taskElement
        );

      }
    );


    peopleContainer.appendChild(
      card
    );

  });


  /* ------------------------------
     Progreso general
  ------------------------------ */

  const totalPercentage =
    totalTasks
    ? Math.round(
        (
          completedTasks /
          totalTasks
        ) * 100
      )
    : 0;


  document
    .getElementById(
      "progressText"
    )
    .textContent =
      completedTasks +
      " de " +
      totalTasks +
      " · " +
      totalPercentage +
      " %";


  document
    .getElementById(
      "progressBar"
    )
    .style.width =
      totalPercentage + "%";


  /* ------------------------------
     Emplatado
  ------------------------------ */

  const platingList =
    document.getElementById(
      "platingList"
    );


  platingList.innerHTML =
    "";


  recipe.plating.forEach(
    function(step){

      const item =
        document.createElement(
          "li"
        );


      item.textContent =
        step;


      platingList.appendChild(
        item
      );

    }
  );

}


/* =========================================
   CAMBIO DE RECETA
========================================= */

document
  .querySelectorAll(
    ".recipe-tab"
  )
  .forEach(function(button){

    button.addEventListener(
      "click",
      function(){

        currentRecipe =
          button.dataset.recipe;


        personFilter =
          "all";


        render();


        window.scrollTo({
          top:0,
          behavior:"smooth"
        });

      }
    );

  });


/* =========================================
   FILTRO POR PERSONA
========================================= */

document
  .querySelectorAll(
    ".filter"
  )
  .forEach(function(button){

    button.addEventListener(
      "click",
      function(){

        personFilter =
          button.dataset.person;


        render();

      }
    );

  });


/* =========================================
   REINICIAR
========================================= */

document
  .getElementById(
    "resetBtn"
  )
  .addEventListener(
    "click",
    function(){

      const recipe =
        recipes[currentRecipe];


      Object.entries(
        recipe.people
      )
      .forEach(
        function(entry){

          const personId =
            entry[0];

          const person =
            entry[1];


          person.tasks.forEach(
            function(task,index){

              localStorage.removeItem(
                storageKey(
                  currentRecipe,
                  personId,
                  index
                )
              );

            }
          );

        }
      );


      render();

    }
  );


/* =========================================
   IMPRIMIR
========================================= */

document
  .getElementById(
    "printBtn"
  )
  .addEventListener(
    "click",
    function(){

      window.print();

    }
  );


/* =========================================
   MODAL DE IMAGEN
========================================= */

const modal =
  document.getElementById(
    "imageModal"
  );


const modalImage =
  document.getElementById(
    "modalImage"
  );


const modalTitle =
  document.getElementById(
    "modalTitle"
  );


document
  .getElementById(
    "openImage"
  )
  .addEventListener(
    "click",
    function(){

      const recipe =
        recipes[currentRecipe];


      modalImage.src =
        recipe.image;


      modalImage.alt =
        recipe.imageAlt;


      modalTitle.textContent =
        recipe.name +
        " · Emplatado";


      modal.classList.add(
        "open"
      );


      document.body.style.overflow =
        "hidden";

    }
  );


function closeImageModal(){

  modal.classList.remove(
    "open"
  );


  document.body.style.overflow =
    "";

}


document
  .getElementById(
    "closeModal"
  )
  .addEventListener(
    "click",
    closeImageModal
  );


modal.addEventListener(
  "click",
  function(event){

    if(
      event.target === modal
    ){

      closeImageModal();

    }

  }
);


document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape"
    ){

      closeImageModal();

    }

  }
);


/* =========================================
   INICIO
========================================= */

render();

</script>

</body>
</html>
