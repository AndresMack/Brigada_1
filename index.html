<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>5s — Página en pausa</title>

  <meta
    name="description"
    content="Página temporal para el lanzamiento de una nueva receta."
  >

  <style>
    :root {
      --fondo: #000904;
      --verde: #00ef61;
      --verde-claro: #d8ffe6;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: var(--fondo);
      color: var(--verde-claro);
      font-family: "Courier New", Courier, monospace;
    }

    .standby-shell {
      position: relative;
      isolation: isolate;
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      place-items: center;
      overflow: hidden;
      padding: 64px 24px;

      background:
        radial-gradient(
          circle at center,
          rgba(0, 72, 31, 0.14),
          transparent 52%
        );
    }

    #matrix {
      position: fixed;
      z-index: -4;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.58;
      pointer-events: none;
    }

    .vignette {
      position: fixed;
      z-index: -3;
      inset: 0;
      pointer-events: none;

      background:
        radial-gradient(
          circle,
          transparent 18%,
          rgba(0, 7, 2, 0.55) 60%,
          #000 112%
        );
    }

    .scanlines {
      position: fixed;
      z-index: 10;
      inset: 0;
      opacity: 0.16;
      pointer-events: none;

      background:
        repeating-linear-gradient(
          0deg,
          transparent 0 3px,
          rgba(0, 0, 0, 0.8) 3px 4px
        );
    }

    .system-header,
    .system-footer {
      position: fixed;
      z-index: 7;
      left: 28px;
      right: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: rgba(116, 255, 168, 0.62);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .system-header {
      top: 22px;
    }

    .system-footer {
      bottom: 20px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--verde);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--verde);
      box-shadow: 0 0 12px var(--verde);
      animation: pulse 1.25s steps(2) infinite;
    }

    .terminal-card {
      position: relative;
      z-index: 2;
      width: min(720px, 100%);

      border:
        1px solid rgba(0, 239, 97, 0.34);

      background:
        linear-gradient(
          145deg,
          rgba(0, 19, 8, 0.91),
          rgba(0, 7, 3, 0.96)
        );

      box-shadow:
        0 0 0 1px rgba(0, 239, 97, 0.05),
        0 0 70px rgba(0, 239, 97, 0.11),
        inset 0 0 65px rgba(0, 239, 97, 0.025);

      backdrop-filter: blur(7px);
      animation: boot 0.65s ease-out both;
    }

    .terminal-card::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.09;
      pointer-events: none;

      background-image:
        linear-gradient(
          90deg,
          transparent 49.8%,
          var(--verde) 50%,
          transparent 50.2%
        );
    }

    .terminal-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      min-height: 38px;
      padding: 0 16px;

      border-bottom:
        1px solid rgba(0, 239, 97, 0.18);

      color: rgba(139, 255, 179, 0.55);
      font-size: 9px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .terminal-bar > :last-child {
      justify-self: end;
    }

    .terminal-dots {
      display: flex;
      gap: 6px;
    }

    .terminal-dots i {
      width: 6px;
      height: 6px;

      border:
        1px solid rgba(0, 239, 97, 0.62);

      border-radius: 50%;
    }

    .terminal-dots i:first-child {
      background: var(--verde);
      box-shadow: 0 0 8px var(--verde);
    }

    .terminal-body {
      padding:
        clamp(32px, 7vw, 64px)
        clamp(22px, 8vw, 72px)
        42px;

      text-align: center;
    }

    .access-line {
      margin: 0 0 28px;
      color: rgba(113, 255, 166, 0.58);
      font-size: 9px;
      letter-spacing: 0.2em;
    }

    .access-line span {
      color: var(--verde);
    }

    .icon-lock {
      position: relative;
      width: 46px;
      height: 54px;
      margin: 0 auto 26px;

      filter:
        drop-shadow(
          0 0 10px rgba(0, 239, 97, 0.35)
        );
    }

    .lock-shackle {
      position: absolute;
      top: 0;
      left: 10px;
      width: 26px;
      height: 27px;

      border: 2px solid var(--verde);
      border-bottom: 0;
      border-radius: 15px 15px 0 0;
    }

    .lock-body {
      position: absolute;
      inset: 19px 0 0;
      display: grid;
      place-items: center;

      border: 2px solid var(--verde);
      background: #001c0b;
      color: var(--verde);

      font-size: 15px;
      font-weight: 800;
    }

    h1 {
      position: relative;
      margin: 0;
      color: #e2ffec;
      font-size: clamp(28px, 6vw, 54px);
      line-height: 0.98;
      letter-spacing: -0.045em;

      text-shadow:
        0 0 8px rgba(0, 239, 97, 0.72),
        0 0 24px rgba(0, 239, 97, 0.3);
    }

    h1::before,
    h1::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      overflow: hidden;
      opacity: 0.45;
      pointer-events: none;
    }

    h1::before {
      color: #00ff66;
      clip-path: inset(15% 0 64% 0);
      animation: glitch 2.2s infinite steps(2);
    }

    h1::after {
      color: #b6ffd1;
      clip-path: inset(67% 0 12% 0);
      animation: glitch 1.9s infinite steps(2) reverse;
    }

    .main-message {
      margin: 18px 0 0;
      color: rgba(180, 255, 206, 0.64);
      font-size: clamp(13px, 2.2vw, 17px);
      line-height: 1.75;
      letter-spacing: 0.04em;
    }

    .main-message strong {
      color: var(--verde);
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .cursor {
      animation: blink 0.75s steps(2) infinite;
    }

    .countdown-block {
      width: min(330px, 100%);
      margin: 34px auto 0;
      padding-top: 26px;

      border-top:
        1px solid rgba(0, 239, 97, 0.16);
    }

    .countdown-label {
      margin: 0 0 7px;
      color: rgba(137, 255, 178, 0.5);
      font-size: 9px;
      letter-spacing: 0.22em;
    }

    .countdown {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 9px;
      color: var(--verde);
    }

    #seconds {
      font-size: 52px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;

      text-shadow:
        0 0 18px rgba(0, 239, 97, 0.45);
    }

    .countdown small {
      font-size: 9px;
      letter-spacing: 0.16em;
    }

    .progress-track {
      height: 2px;
      margin-top: 16px;
      overflow: hidden;
      background: rgba(0, 239, 97, 0.12);
    }

    #progress {
      display: block;
      width: 100%;
      height: 100%;
      margin-left: auto;
      background: var(--verde);
      box-shadow: 0 0 12px var(--verde);
      transition: width 0.85s linear;
    }

    .corner {
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: var(--verde);

      filter:
        drop-shadow(0 0 5px var(--verde));
    }

    .corner-tl {
      top: -5px;
      left: -5px;
      border-top: 2px solid;
      border-left: 2px solid;
    }

    .corner-tr {
      top: -5px;
      right: -5px;
      border-top: 2px solid;
      border-right: 2px solid;
    }

    .corner-bl {
      bottom: -5px;
      left: -5px;
      border-bottom: 2px solid;
      border-left: 2px solid;
    }

    .corner-br {
      right: -5px;
      bottom: -5px;
      border-right: 2px solid;
      border-bottom: 2px solid;
    }

    /* Pantalla final cuando el navegador no puede cerrarse */

    .disconnect-screen {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      background: #000;
      text-align: center;
    }

    .disconnect-content {
      position: relative;
      z-index: 3;
      width: min(700px, 100%);
    }

    .disconnect-small {
      margin: 0 0 20px;
      color: rgba(0, 239, 97, 0.6);
      font-size: 11px;
      letter-spacing: 0.35em;
    }

    .disconnect-title {
      margin: 0;
      color: var(--verde);
      font-size: clamp(34px, 7vw, 72px);
      line-height: 1;
      letter-spacing: -0.04em;

      text-shadow:
        0 0 10px var(--verde),
        0 0 35px rgba(0, 239, 97, 0.65);
    }

    .disconnect-message {
      margin: 24px 0 0;
      color: rgba(164, 255, 197, 0.65);
      font-size: 13px;
      line-height: 1.7;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .disconnect-line {
      width: min(400px, 80%);
      height: 2px;
      margin: 30px auto;
      background: var(--verde);
      box-shadow: 0 0 15px var(--verde);
      animation: lineClose 1.2s ease forwards;
    }

    @keyframes boot {
      from {
        opacity: 0;
        transform: scaleY(0.05);
        filter: brightness(3);
      }

      55% {
        opacity: 1;
        transform: scaleY(0.05);
      }

      to {
        opacity: 1;
        transform: scaleY(1);
        filter: brightness(1);
      }
    }

    @keyframes pulse {
      50% {
        opacity: 0.2;
      }
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @keyframes glitch {
      0%,
      88%,
      100% {
        transform: translate(0);
      }

      90% {
        transform: translate(4px, -1px);
      }

      94% {
        transform: translate(-4px, 1px);
      }
    }

    @keyframes lineClose {
      from {
        width: min(400px, 80%);
      }

      to {
        width: 0;
      }
    }

    @media (max-width: 560px) {
      .standby-shell {
        padding-inline: 16px;
      }

      .system-header,
      .system-footer {
        left: 16px;
        right: 16px;
      }

      .system-id,
      .system-footer span:last-child,
      .terminal-bar > :last-child {
        display: none;
      }

      .system-header {
        justify-content: flex-end;
      }

      .terminal-bar {
        grid-template-columns: 1fr auto;
      }

      .terminal-bar > span {
        justify-self: end;
      }

      .terminal-body {
        padding-bottom: 32px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .terminal-card,
      h1::before,
      h1::after,
      .status-dot,
      .cursor {
        animation: none;
      }

      .scanlines {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main
    id="mainPage"
    class="standby-shell"
  >
    <canvas
      id="matrix"
      aria-hidden="true"
    ></canvas>

    <div
      class="vignette"
      aria-hidden="true"
    ></div>

    <div
      class="scanlines"
      aria-hidden="true"
    ></div>

    <header
      class="system-header"
      aria-label="Estado del sistema"
    >
      <span class="system-id">
        SYS://RECETARIO.ROOT
      </span>

      <span class="status">
        <i class="status-dot"></i>
        STANDBY_MODE
      </span>
    </header>

    <section
      class="terminal-card"
      aria-live="polite"
    >
      <span class="corner corner-tl"></span>
      <span class="corner corner-tr"></span>
      <span class="corner corner-bl"></span>
      <span class="corner corner-br"></span>

      <div class="terminal-bar">
        <div
          class="terminal-dots"
          aria-hidden="true"
        >
          <i></i>
          <i></i>
          <i></i>
        </div>

        <span>recipe_protocol.exe</span>
        <span>ENC: AES-256</span>
      </div>

      <div class="terminal-body">
        <p class="access-line">
          <span>&gt;</span>
          ACCESO TEMPORALMENTE SUSPENDIDO
        </p>

        <div
          class="icon-lock"
          aria-hidden="true"
        >
          <span class="lock-shackle"></span>
          <span class="lock-body">R</span>
        </div>

        <h1 data-text="PÁGINA FUERA DE USO">
          PÁGINA FUERA DE USO
        </h1>

        <p class="main-message">
          Se habilita para una nueva receta
          <br>

          <strong>
            próximamente<span class="cursor">_</span>
          </strong>
        </p>

        <div class="countdown-block">
          <p class="countdown-label">
            CIERRE AUTOMÁTICO EN
          </p>

          <div
            id="countdown"
            class="countdown"
            aria-label="5 segundos"
          >
            <span id="seconds">05</span>
            <small>SEG</small>
          </div>

          <div
            class="progress-track"
            aria-hidden="true"
          >
            <span id="progress"></span>
          </div>
        </div>
      </div>
    </section>

    <footer class="system-footer">
      <span>NODE_07 // SECURE_CONNECTION</span>
      <span>© KITCHEN NETWORK</span>
    </footer>
  </main>

  <script>
    /*
     * EFECTO MATRIX
     */

    const canvas =
      document.getElementById("matrix");

    const context =
      canvas.getContext("2d");

    const characters =
      "01アイウエオカキクケコサシスセソタチツテト<>/{}[]#$_";

    const fontSize = 17;

    let columns = 0;
    let drops = [];
    let previousTime = 0;
    let matrixAnimation;

    function resizeCanvas() {
      const ratio = Math.min(
        window.devicePixelRatio || 1,
        2
      );

      canvas.width =
        window.innerWidth * ratio;

      canvas.height =
        window.innerHeight * ratio;

      canvas.style.width =
        window.innerWidth + "px";

      canvas.style.height =
        window.innerHeight + "px";

      context.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
      );

      columns = Math.ceil(
        window.innerWidth / fontSize
      );

      drops = Array.from(
        { length: columns },
        function () {
          return Math.floor(
            Math.random() *
            (-window.innerHeight / fontSize)
          );
        }
      );
    }

    function drawMatrix(time) {
      if (time - previousTime > 48) {
        context.fillStyle =
          "rgba(0, 8, 3, 0.13)";

        context.fillRect(
          0,
          0,
          window.innerWidth,
          window.innerHeight
        );

        context.font =
          "600 " +
          fontSize +
          "px 'Courier New', monospace";

        drops.forEach(
          function (drop, index) {
            const character =
              characters[
                Math.floor(
                  Math.random() *
                  characters.length
                )
              ];

            const x =
              index * fontSize;

            const y =
              drop * fontSize;

            context.shadowBlur = 8;
            context.shadowColor = "#00ff66";

            context.fillStyle =
              Math.random() > 0.975
                ? "#caffdc"
                : "#00ce52";

            context.fillText(
              character,
              x,
              y
            );

            context.shadowBlur = 0;

            if (
              y > window.innerHeight &&
              Math.random() > 0.965
            ) {
              drops[index] = 0;
            } else {
              drops[index] =
                drop + 1;
            }
          }
        );

        previousTime = time;
      }

      matrixAnimation =
        requestAnimationFrame(drawMatrix);
    }

    resizeCanvas();

    window.addEventListener(
      "resize",
      resizeCanvas
    );

    matrixAnimation =
      requestAnimationFrame(drawMatrix);

    /*
     * CONTADOR REGRESIVO
     */

    const secondsElement =
      document.getElementById("seconds");

    const countdownElement =
      document.getElementById("countdown");

    const progressElement =
      document.getElementById("progress");

    let seconds = 5;

    function updateCountdown() {
      secondsElement.textContent =
        String(seconds).padStart(2, "0");

      countdownElement.setAttribute(
        "aria-label",
        seconds + " segundos"
      );

      progressElement.style.width =
        Math.max(0, seconds * 20) + "%";

      document.title =
        seconds + "s — Página en pausa";
    }

    /*
     * CIERRE DE LA PÁGINA
     */

    function attemptToClose() {
      document.title =
        "Cerrando conexión…";

      /*
       * Si la pestaña fue abierta mediante
       * window.open(), el navegador permitirá
       * cerrarla automáticamente.
       */
      if (
        window.opener &&
        !window.opener.closed
      ) {
        window.close();
        return;
      }

      /*
       * Los navegadores no permiten cerrar
       * automáticamente una pestaña que el
       * usuario abrió directamente.
       *
       * En ese caso se muestra una pantalla
       * final de sistema desconectado.
       */
      showDisconnectedScreen();
    }

    function showDisconnectedScreen() {
      cancelAnimationFrame(
        matrixAnimation
      );

      document.title =
        "Sistema desconectado";

      document.body.innerHTML = `
        <main class="disconnect-screen">
          <canvas
            id="finalMatrix"
            aria-hidden="true"
            style="
              position:fixed;
              inset:0;
              width:100%;
              height:100%;
              opacity:0.22;
            "
          ></canvas>

          <div class="scanlines"></div>
          <div class="vignette"></div>

          <section
            class="disconnect-content"
            aria-live="assertive"
          >
            <p class="disconnect-small">
              SESSION_TERMINATED
            </p>

            <h1
              class="disconnect-title"
              data-text="SISTEMA DESCONECTADO"
            >
              SISTEMA DESCONECTADO
            </h1>

            <div
              class="disconnect-line"
              aria-hidden="true"
            ></div>

            <p class="disconnect-message">
              La conexión ha finalizado correctamente.
              <br>
              Ya puedes cerrar esta pestaña.
            </p>
          </section>
        </main>
      `;
    }

    updateCountdown();

    const countdownTimer =
      setInterval(function () {
        seconds -= 1;

        updateCountdown();

        if (seconds <= 0) {
          clearInterval(
            countdownTimer
          );

          attemptToClose();
        }
      }, 1000);
  </script>
</body>
</html>
